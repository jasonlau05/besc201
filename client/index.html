      html[data-page-phase="pending"] #root { opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        html[data-page-phase] #root { opacity: 1; }
      }
    </style>
    <script>
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.pagePhase = 'pending';
        // Fail open if the application or its entrance controller cannot start.
        setTimeout(() => {
          if (document.documentElement.dataset.pagePhase === 'pending') {
            delete document.documentElement.dataset.pagePhase;
          }
        }, 1600);
      }
    </script>
